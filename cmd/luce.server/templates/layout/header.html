        <style>
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                background: #e8e8e8;
                color: #222;
            }
            .page {
                box-sizing: border-box;
                max-width: 40rem;
                margin: 2rem auto;
                padding: 1.5rem 2rem;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            }
            a {
                color: #06c;
            }
            input,
            button {
                font-size: 1rem;
                padding: 0.4rem;
            }
            @media (max-width: 600px) {
                .page {
                    margin: 0;
                    min-height: 100vh;
                    border-radius: 0;
                    box-shadow: none;
                }
                input,
                button {
                    width: 100%;
                    box-sizing: border-box;
                }
            }
        </style>
